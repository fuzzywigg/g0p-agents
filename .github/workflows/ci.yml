name: CI — Lint, Links & Manifests
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [alpha]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"
          config: .markdownlint.yaml

  link-check:
    name: Link Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress '**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Download actionlint
        id: get_actionlint
        run: bash <(curl --fail -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
        shell: bash
      - name: Check workflow files
        run: ${{ steps.get_actionlint.outputs.executable }} -color
        shell: bash

  manifest-validate:
    name: Manifest Validate (Py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Pip check
        run: python -m pip check
      - name: Ruff lint (scripts + tests)
        run: ruff check scripts tests
      - name: List packaging validators
        run: |
          python scripts/validate_manifests.py --list-validators | tee validators.txt
          test "$(wc -l < validators.txt)" -ge 64
      - name: Lock inventory version and validator registry
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import json
          from pathlib import Path
          import validate_manifests as vm

          inv = json.loads(Path("schemas/packaging-inventory.json").read_text())
          assert inv["version"] == vm.INVENTORY_VERSION == 17
          assert sorted(vm.VALIDATORS) == inv["validator_names"]
          assert len(vm.VALIDATORS) >= inv["min_validator_count"] >= 64
          print(f"inventory v{inv['version']}; validators={len(vm.VALIDATORS)}")
          PY
      - name: Validate documented manifests (JSON report)
        run: |
          python scripts/validate_manifests.py --json | tee manifest-findings.json
          test "$(python -c 'import json; print(len(json.load(open("manifest-findings.json"))))')" = "0"
          python scripts/validate_manifests.py
      - name: Smoke each validator subset
        run: |
          set -euo pipefail
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            python scripts/validate_manifests.py --only "$name"
          done < validators.txt
      - name: Run unit tests with coverage
        run: >
          python -m pytest
          --cov=scripts
          --cov-report=term-missing
          --cov-report=xml
          --junitxml=pytest-junit.xml
      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manifest-validate-py${{ matrix.python-version }}
          path: |
            manifest-findings.json
            validators.txt
            coverage.xml
            pytest-junit.xml
          if-no-files-found: warn
