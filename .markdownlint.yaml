# markdownlint configuration
# Ref: https://github.com/DavidAnson/markdownlint

default: true

# Allow long lines in tables and code blocks
MD013:
  line_length: 200
  tables: false
  code_blocks: false

# Allow multiple top-level headings (some docs have H1 + metadata)
MD025: false

# Allow inline HTML (used in some docs)
MD033: false

# Allow duplicate headings across files
MD024:
  siblings_only: true
